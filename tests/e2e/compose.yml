services:
  chromium:
    # Needed for API changes. Bump to a real tag when platform > 0.60.1
    image: ghcr.io/goauthentik/selenium:155.0-ak-0.72.4@sha256:3bef6ce1ec02caf39ce6544c369c386c1d844e7fa3e41b75adb0d5fab7dfdb21
    shm_size: 2g
    network_mode: host
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - io.goauthentik.tests=selenium
    profiles:
      - selenium
    environment:
      VIDEO_READY_PORT: 9912
  mailpit:
    image: docker.io/axllent/mailpit:v1.30.7
    ports:
      - 1025:1025
      - 8025:8025
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8025"]
      interval: 5s
      start_period: 1s
