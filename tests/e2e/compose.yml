services:
  chromium:
    # Needed for API changes. Bump to a real tag when platform > 0.60.1
    image: ghcr.io/goauthentik/selenium:152.0-ak-0.71.0@sha256:0e6c06b0cd76a1a5de55588463e17098d03a67cd42ac529307abce031fd93bb5
    shm_size: 2g
    network_mode: host
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - io.goauthentik.tests=selenium
    profiles:
      - selenium
    environment:
      VIDEO_READY_PORT: 9912
  mailpit:
    image: docker.io/axllent/mailpit:v1.30.7
    ports:
      - 1025:1025
      - 8025:8025
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8025"]
      interval: 5s
      start_period: 1s
