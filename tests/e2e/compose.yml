services:
  chromium:
    # Needed for API changes. Bump to a real tag when platform > 0.60.1
    image: ghcr.io/goauthentik/selenium:155.0-ak-0.73.0@sha256:e8804c5ca966bc769a3dd2806801fb2d80e6f7cb2f8dd4aaca392c35e03e068d
    shm_size: 2g
    network_mode: host
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - io.goauthentik.tests=selenium
    profiles:
      - selenium
    environment:
      VIDEO_READY_PORT: 9912
  mailpit:
    image: docker.io/axllent/mailpit:v1.30.7
    ports:
      - 1025:1025
      - 8025:8025
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8025"]
      interval: 5s
      start_period: 1s
